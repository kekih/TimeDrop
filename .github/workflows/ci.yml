name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: |
          go build -trimpath -ldflags="-s -w" -o timedrop .
          ./timedrop -h || true

      - name: Verify binary
        run: file timedrop && ls -lh timedrop
