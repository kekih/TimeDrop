name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
      - name: Build
        run: |
          go mod tidy
          wails build -platform linux/amd64 -clean
          cp build/bin/TimeDrop timedrop-linux-amd64 || cp build/bin/timedrop timedrop-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: timedrop-linux-amd64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
      - name: Build
        shell: bash
        run: |
          go mod tidy
          wails build -platform windows/amd64 -clean
          cp build/bin/TimeDrop.exe timedrop-windows-amd64.exe || cp build/bin/TimeDrop.exe timedrop-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: timedrop-windows-amd64.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
      - name: Build
        run: |
          go mod tidy
          wails build -platform darwin/universal -clean || wails build -platform darwin/arm64 -clean
          find build/bin -type f -name 'TimeDrop*' -exec cp {} timedrop-darwin \;
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: timedrop-darwin*

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Files
        run: find artifacts -type f -ls
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          name: TimeDrop ${{ github.ref_name || format('v{0}', inputs.version) }}
          files: artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
