name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag name (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
      - name: Build
        run: |
          set -e
          go mod tidy
          wails build -platform linux/amd64 -clean -ldflags "-s -w"
          mkdir -p dist
          if [ -f build/bin/TimeDrop ]; then cp build/bin/TimeDrop dist/TimeDrop-linux-amd64
          elif [ -f build/bin/timedrop ]; then cp build/bin/timedrop dist/TimeDrop-linux-amd64
          else ls -laR build; exit 1; fi
          chmod +x dist/TimeDrop-linux-amd64
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/TimeDrop-linux-amd64
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
      - name: Build
        shell: bash
        run: |
          set -e
          go mod tidy
          wails build -platform windows/amd64 -clean -ldflags "-s -w"
          mkdir -p dist
          if [ -f build/bin/TimeDrop.exe ]; then cp build/bin/TimeDrop.exe dist/TimeDrop-windows-amd64.exe
          else ls -laR build; exit 1; fi
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/TimeDrop-windows-amd64.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
      - name: Build
        run: |
          set -e
          go mod tidy
          wails build -platform darwin/arm64 -clean -ldflags "-s -w" || wails build -platform darwin/amd64 -clean -ldflags "-s -w"
          mkdir -p dist
          # app bundle or binary
          if [ -d build/bin/TimeDrop.app ]; then
            ditto -c -k --sequesterRsrc --keepParent build/bin/TimeDrop.app dist/TimeDrop-macos.app.zip
          elif [ -f build/bin/TimeDrop ]; then
            cp build/bin/TimeDrop dist/TimeDrop-macos
            chmod +x dist/TimeDrop-macos
          else
            ls -laR build; exit 1
          fi
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List files
        run: find artifacts -type f -ls
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: TimeDrop ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
